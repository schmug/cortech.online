name: Mythos tracker

on:
  schedule:
    - cron: '0 19 * * *' # 2pm EST / 3pm EDT
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Generation goes through the Claude Code CLI so the tracker bills the
      # Claude subscription (CLAUDE_CODE_OAUTH_TOKEN) rather than API credits.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Generate one with 'claude setup-token' and add it as a repo secret."
            exit 1
          fi
          # Fail loudly on a dead token here rather than after the payload diff,
          # so an auth problem can never hide behind an unchanged-payload no-op.
          echo "ping" | claude -p --restricted --output-format json --model claude-sonnet-4-6 \
            --append-system-prompt 'Reply with the single word: ok' > /tmp/auth-probe.json
          node -e 'const r=require("/tmp/auth-probe.json"); if(r.is_error||typeof r.result!=="string"){console.error("::error::Claude auth probe failed:",JSON.stringify(r).slice(0,400));process.exit(1)} console.log("auth ok:",r.result.trim())'

      - name: Run tracker
        id: tracker
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npm run mythos:run

      - name: Configure git
        if: steps.tracker.outputs.branch
        run: |
          git config user.name 'mythos-bot'
          git config user.email 'mythos-bot@users.noreply.github.com'

      - name: Commit + push branch
        if: steps.tracker.outputs.branch
        env:
          BRANCH: ${{ steps.tracker.outputs.branch }}
          TITLE: ${{ steps.tracker.outputs.title }}
        run: |
          git checkout -b "$BRANCH"
          git add src/content/mythos
          git commit -m "feat(mythos): ${TITLE:-tracker update}

          Generated by .github/workflows/mythos.yml.

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git push --set-upstream origin "$BRANCH"

      - name: Open + auto-merge PR
        if: steps.tracker.outputs.branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.tracker.outputs.branch }}
          TITLE: ${{ steps.tracker.outputs.title }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(mythos): ${TITLE:-tracker update}" \
            --body "Automated Mythos tracker post. Source: red.anthropic.com/2026/cvd/. Workflow: .github/workflows/mythos.yml."
          gh pr merge --auto --squash "$BRANCH"

      - name: Open issue on guardrail failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Mythos tracker workflow failed on $(date +%Y-%m-%d)" \
            --body "Workflow run: ${RUN_URL}" \
            --label "mythos,bot-failure"
